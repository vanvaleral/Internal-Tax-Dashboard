<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tax Operations & Claim Control Center Demo</title>
  <style>
    :root {
      --canvas: #f2f0ea;
      --panel: rgba(255, 255, 255, 0.9);
      --panel-solid: #ffffff;
      --ink: #182630;
      --muted: #62717d;
      --line: #d8d4ca;
      --accent: #0f766e;
      --accent-soft: #d9f1ed;
      --accent-strong: #1e3a8a;
      --my-work-start: #5068b8;
      --my-work-end: #8498e8;
      --points-start: #172554;
      --points-end: #2563eb;
      --my-work-image: none;
      --my-work-overlay-start: rgba(31, 55, 145, .58);
      --my-work-overlay-end: rgba(95, 120, 220, .34);
      --warning: #b76a0a;
      --warning-soft: #fdf1da;
      --danger: #be123c;
      --danger-soft: #ffe1ea;
      --neutral-soft: #edf1f5;
      --shadow: 0 10px 24px rgba(24, 38, 48, 0.08);
      --workspace-width: 1320px;
    }

    body.theme-dark {
      --canvas: #111827;
      --panel: rgba(24, 33, 48, 0.92);
      --panel-solid: #182130;
      --ink: #edf2f7;
      --muted: #aab7c8;
      --line: #344154;
      --neutral-soft: #273447;
      --shadow: 0 14px 32px rgba(0, 0, 0, 0.28);
      background: radial-gradient(circle at top left, color-mix(in srgb, var(--accent) 22%, transparent), transparent 28%), var(--canvas);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", Arial, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(15, 118, 110, 0.1), transparent 28%),
        radial-gradient(circle at top right, rgba(183, 106, 10, 0.08), transparent 22%),
        var(--canvas);
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
      transition: transform 150ms ease, box-shadow 150ms ease, filter 150ms ease, background-color 150ms ease;
    }

    button:hover:not(:disabled) {
      filter: brightness(1.03);
      transform: translateY(-1px);
      box-shadow: 0 5px 12px rgba(24, 38, 48, 0.12);
    }

    button:active:not(:disabled) {
      transform: translateY(0) scale(0.98);
      box-shadow: none;
    }

    button:disabled {
      cursor: wait;
    }

    .app-loading-overlay {
      position: fixed;
      z-index: 100;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(18, 31, 41, 0.5);
      backdrop-filter: blur(4px) brightness(0.72);
      opacity: 0;
      pointer-events: none;
      transition: opacity 180ms ease;
    }

    .app-loading-overlay.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .app-loading-card {
      min-width: 220px;
      padding: 22px;
      border-radius: 18px;
      background: #ffffff;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.24);
      text-align: center;
    }

    .app-loading-spinner {
      width: 30px;
      height: 30px;
      margin: 0 auto 12px;
      border: 3px solid #d9e7f5;
      border-top-color: #1d4e89;
      border-radius: 50%;
      animation: appSpinner 700ms linear infinite;
    }

    @keyframes appSpinner { to { transform: rotate(360deg); } }

    h1, h2, h3, h4, p {
      margin: 0;
    }

    .shell {
      max-width: 1780px;
      margin: 0 auto;
      padding: 14px;
      display: grid;
      grid-template-columns: 240px 1fr;
      gap: 14px;
    }

    .shell,
    .main,
    .main > *,
    .panel,
    .workspace-frame,
    .global-topbar,
    .hero > *,
    .section-title > * {
      min-width: 0;
    }

    .sidebar,
    .panel,
    .metric,
    .kanban-column,
    .kanban-card,
    .detail-card {
      border: 1px solid rgba(216, 212, 202, 0.95);
      background: var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(8px);
    }

    .sidebar {
      position: sticky;
      top: 14px;
      height: calc(100vh - 28px);
      padding: 16px;
      border-radius: 26px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow-y: auto;
    }

    .eyebrow {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.22em;
      font-weight: 700;
      color: var(--muted);
    }

    .sidebar h1 {
      margin-top: 6px;
      font-size: 25px;
      line-height: 1.02;
      letter-spacing: -0.04em;
    }

    .nav {
      display: grid;
      gap: 6px;
    }

    .nav-btn {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 11px 13px;
      border-radius: 15px;
      background: transparent;
      color: #4c5a68;
      font-size: 13px;
      font-weight: 700;
      text-align: left;
    }

    .nav-btn.active {
      background: var(--accent-strong);
      color: white;
    }

    input,
    select,
    textarea,
    .field,
    .inline-input,
    .inline-select,
    .inline-textarea {
      max-width: 100%;
    }

    .my-work-shell { max-width: none; padding: 0; }
    .my-work-panel { min-height: calc(100vh - 100px); display:grid; grid-template-columns:minmax(430px, 1.25fr) minmax(360px, .75fr); overflow:hidden; border-radius:20px; }
    .my-work-list { display:flex; flex-direction:column; min-height:0; padding:30px; color:#fff; background-color:var(--my-work-start); background-image:linear-gradient(145deg, var(--my-work-overlay-start), var(--my-work-overlay-end)), var(--my-work-image); background-position:center; background-size:cover; }
    .my-work-list h2 { font-size:28px; color:#fff; }
    .my-work-row { width:100%; display:grid; grid-template-columns:24px 1fr 24px; gap:12px; align-items:start; margin:3px 0; padding:12px; text-align:left; border-radius:4px; background:rgba(255,255,255,.70); color:#1f2732; backdrop-filter:blur(8px); }
    .my-work-row.is-new { animation:taskEnter 230ms ease both; }
    .my-work-row.is-completing { animation:taskCompleteMove 360ms ease both; }
    .my-work-row.is-restoring { animation:taskRestoreMove 360ms ease both; }
    .my-work-row.is-complete { background:rgba(44,58,91,.78); color:#d7deef; }
    .my-work-row.is-complete strong { color:#c7d0e5; text-decoration:line-through; }
    .my-work-row.is-complete .subline { color:#aeb9d2; }
    .circle-check { appearance:none; width:19px; height:19px; margin:2px 0 0; border:2px solid #6b7280; border-radius:50%; background:#fff; }
    .circle-check:checked { border-color:var(--accent); background:radial-gradient(circle,var(--accent) 45%,#fff 48%); }
    .my-work-task-list { flex:1; min-height:0; margin-top:24px; overflow:auto; }
    .my-work-composer { display:flex; flex:0 0 auto; gap:10px; margin-top:12px; padding:12px; background:rgba(232,237,255,.65); border-radius:5px; backdrop-filter:blur(8px); }
    .my-work-composer input { flex:1; border:0; background:transparent; outline:0; }
    .my-work-detail { display:flex; flex-direction:column; padding:28px 22px; background:#fff; }
    .my-work-detail.is-opening { animation:drawerIn 260ms ease both; }
    .my-work-detail h3 { font-size:22px; line-height:1.25; margin:10px 0 18px; }
    .my-work-title-input { width:calc(100% - 35px); min-height:35px; padding:4px 0 6px; border:0; border-bottom:1px solid transparent; color:#1f2732; background:transparent; font:700 22px/1.25 var(--font-body); outline:0; overflow:hidden; resize:none; vertical-align:top; }
    .my-work-title-input:focus { border-bottom-color:var(--accent); }
    .my-work-option { display:block; padding:14px 0; border-bottom:1px solid #e5e7eb; }
    .my-work-card { padding:14px; border:1px solid #e5e7eb; border-radius:3px; margin-bottom:10px; }
    .my-work-star { float:right; font-size:22px; background:transparent; color:#6b7280; }
    .my-work-star.active { color:#eab308; }
    .my-work-add-step { display:flex; align-items:center; gap:10px; width:100%; min-height:38px; padding:10px 8px; border:0; color:var(--accent); background:transparent; font:600 14px/1 var(--font-body); text-align:left; }
    button.my-work-add-step:hover:not(:disabled), button.my-work-add-step:focus-visible:not(:disabled) { color:var(--accent-strong); background:var(--accent-soft); box-shadow:none !important; filter:none; transform:none !important; }
    .my-work-step-entry { display:grid; grid-template-columns:19px 1fr; gap:10px; align-items:center; margin:8px 0; }
    .my-work-step-entry .circle-check { display:block; }
    .my-work-step-entry input { width:100%; padding:7px 0; border:0; border-bottom:1px solid #e5e7eb; background:#fff; outline:0; }
    .my-work-step-entry input:focus { border-bottom-color:#3679cf; }
    .my-work-step-row { display:grid; grid-template-columns:19px 1fr 16px; gap:10px; align-items:center; margin:10px 0; color:#4b5563; }
    .my-work-action-card { display:flex; align-items:center; gap:12px; width:100%; min-height:68px; margin-bottom:10px; padding:18px; border:1px solid #e5e7eb; border-radius:3px; color:#414b59; background:#fff; text-align:left; transition:background-color 160ms ease; }
    button.my-work-action-card:hover:not(:disabled), button.my-work-action-card:focus-visible:not(:disabled) { background:#f3f6ff; box-shadow:none !important; filter:none; transform:none !important; }
    .my-work-action-icon { width:19px; height:19px; flex:0 0 auto; stroke:currentColor; stroke-width:1.7; fill:none; stroke-linecap:round; stroke-linejoin:round; }
    .my-work-assignment { display:flex; align-items:center; gap:12px; width:100%; }
    .my-work-assignment input { flex:1; min-width:0; }
    .my-work-assignees { display:flex; flex-wrap:wrap; gap:6px; margin:4px 0 12px; }
    .my-work-assignee-chip { padding:4px 8px; border-radius:999px; color:#31517d; background:#e8f0ff; font-size:12px; }
    .my-work-meta { margin-top:auto; padding-top:16px; color:#7a8493; font-size:12px; }
    .my-work-time-dialog-backdrop { position:fixed; z-index:70; inset:0; display:grid; place-items:center; padding:20px; background:rgba(28,36,54,.32); }
    .my-work-time-dialog { width:min(360px, 100%); padding:18px; border:1px solid #d9dfeb; border-radius:12px; background:#fff; box-shadow:0 20px 50px rgba(25,34,54,.25); }
    .my-work-time-dialog h3 { margin:0 0 12px; font-size:18px; }
    .my-work-time-dialog button { display:flex; justify-content:space-between; width:100%; padding:12px; border-bottom:1px solid #e5e7eb; background:#fff; text-align:left; }
    .my-work-time-dialog button:hover { background:#f3f6ff; box-shadow:none; transform:none; }
    @keyframes taskEnter { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
    @keyframes taskCompleteMove { from { opacity:.3; transform:translateY(-22px); } to { opacity:1; transform:translateY(0); } }
    @keyframes taskRestoreMove { from { opacity:.3; transform:translateY(22px); } to { opacity:1; transform:translateY(0); } }
    @keyframes drawerIn { from { opacity:0; transform:translateX(28px); } to { opacity:1; transform:translateX(0); } }

    .role-bar {
      display: none;
    }

    .main {
      display: grid;
      gap: 12px;
      align-content: start;
      justify-items: center;
    }

    .main > .panel,
    .main > .view {
      width: 100%;
      max-width: var(--workspace-width);
    }

    .panel {
      border-radius: 22px;
      padding: 14px;
    }

    .hero,
    .section-title,
    .toolbar,
    .toolbar-left,
    .toolbar-right,
    .chips,
    .inline-controls,
    .info-grid,
    .claim-grid,
    .role-bar,
    .footer-links {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .hero {
      justify-content: space-between;
      align-items: flex-start;
      gap: 14px;
    }

    .hero h2 {
      margin-top: 8px;
      font-size: 33px;
      line-height: 1;
      letter-spacing: -0.04em;
    }

    .hero p {
      margin-top: 10px;
      max-width: 920px;
      font-size: 13px;
      line-height: 1.65;
      color: #485864;
    }

    .badge,
    .pill,
    .status-dot {
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }

    .accent {
      background: var(--accent-soft);
      color: var(--accent);
    }

    .warning {
      background: var(--warning-soft);
      color: var(--warning);
    }

    .danger {
      background: var(--danger-soft);
      color: var(--danger);
    }

    .neutral {
      background: var(--neutral-soft);
      color: #55636f;
    }

    .view.hidden {
      display: none;
    }

    .hidden {
      display: none !important;
    }

    .section-title {
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .section-title h3 {
      font-size: 18px;
      letter-spacing: -0.02em;
    }

    .section-title p {
      color: var(--muted);
      font-size: 12px;
    }

    .global-topbar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .breadcrumb {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.5;
    }

    .global-topbar {
      overflow: hidden;
    }

    .topbar-actions {
      position: relative;
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .database-status-chip {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 0 9px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: #f3f6f8;
      color: var(--muted);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .02em;
      white-space: nowrap;
    }

    .database-status-chip.is-connected {
      border-color: #b9e5d0;
      background: #e8f8ef;
      color: #14764c;
    }

    .database-status-chip.is-warning {
      border-color: #ecd69d;
      background: #fff8e7;
      color: #8a6517;
    }

    .database-status-chip.is-demo {
      border-color: #d6dde3;
      background: #f3f6f8;
      color: #667482;
    }

    .database-status-chip.is-updating {
      border-color: #b9d5f4;
      background: #edf6ff;
      color: #23619b;
    }

    .inbox-trigger {
      position: relative;
      min-height: 34px;
      padding: 0 11px;
    }

    .inbox-badge {
      display: inline-grid;
      min-width: 17px;
      height: 17px;
      margin-left: 5px;
      place-items: center;
      border-radius: 999px;
      background: #d84f4f;
      color: white;
      font-size: 9px;
      font-weight: 800;
    }

    .announcement-inbox {
      position: fixed;
      z-index: 70;
      top: 70px;
      right: 24px;
      width: min(420px, calc(100vw - 24px));
      max-height: min(650px, calc(100vh - 94px));
      overflow: auto;
      padding: 14px;
      border: 1px solid rgba(216, 212, 202, 0.95);
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.98);
      box-shadow: 0 24px 70px rgba(24, 38, 48, 0.2);
    }

    .announcement-inbox-head,
    .announcement-item-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .announcement-list {
      display: grid;
      gap: 8px;
      margin-top: 12px;
    }

    .announcement-item {
      width: 100%;
      padding: 12px;
      border: 1px solid rgba(216, 212, 202, 0.88);
      border-radius: 14px;
      background: #fff;
      color: var(--ink);
      text-align: left;
    }

    .announcement-item.unread {
      border-color: #9dc4fb;
      background: #f3f8ff;
    }

    .announcement-item p {
      margin-top: 7px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
      white-space: pre-wrap;
    }

    .announcement-meta {
      margin-top: 8px;
      color: #687987;
      font-size: 10px;
      font-weight: 700;
    }

    .announcement-composer {
      display: grid;
      gap: 10px;
    }

    .client-editor-backdrop {
      position: fixed;
      z-index: 70;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(19, 34, 44, 0.42);
      backdrop-filter: blur(4px);
    }

    .client-editor-modal {
      width: min(900px, 100%);
      max-height: min(88vh, 860px);
      overflow: auto;
      padding: 18px;
      border: 1px solid rgba(216, 212, 202, 0.95);
      border-radius: 22px;
      background: #fffefb;
      box-shadow: 0 28px 80px rgba(19, 34, 44, 0.28);
    }

    .client-editor-head,
    .client-editor-actions {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
    }

    .client-editor-head { margin-bottom: 14px; }
    .client-editor-actions { margin-top: 14px; justify-content: flex-end; }

    .import-preview-modal { width: min(1120px, 100%); }
    .import-preview-summary { display: grid; grid-template-columns: repeat(4, minmax(120px, 1fr)); gap: 10px; margin-bottom: 14px; }
    .import-preview-warning { color: #a61b1b; font-weight: 800; }
    .import-preview-error-row { background: #fff5f5; }
    .import-preview-error { display: inline-flex; align-items: center; gap: 5px; color: #a61b1b; font-size: 11px; font-weight: 750; line-height: 1.35; }
    .import-preview-table { max-height: 420px; overflow: auto; border: 1px solid var(--border); border-radius: 12px; }
    .duplicate-review-table { max-height: min(62vh, 620px); }
    .duplicate-review-table table { min-width: 860px; }
    .duplicate-review-table th, .duplicate-review-table td { padding: 7px 9px; font-size: 12px; white-space: nowrap; }
    .duplicate-review-table td:nth-child(5) { max-width: 250px; overflow: hidden; text-overflow: ellipsis; }
    .duplicate-review-table .duplicate-group-start td { border-top: 2px solid var(--ink); }
    .duplicate-review-table input { margin: 0; vertical-align: middle; }
    @media (max-width: 760px) { .import-preview-summary { grid-template-columns: repeat(2, minmax(120px, 1fr)); } }

    .workspace-clients .client-master-layout .client-setup-panel { display: none; }

    .workspace-clients { max-width: none; }
    .workspace-clients .client-master-layout { grid-template-columns: minmax(0, 1fr); }

    .client-fab {
      position: fixed;
      z-index: 35;
      right: 26px;
      bottom: 26px;
      display: inline-flex;
      gap: 8px;
      align-items: center;
      min-height: 48px;
      padding: 0 17px;
      border: 0;
      border-radius: 999px;
      background: var(--ink);
      color: white;
      box-shadow: 0 12px 28px rgba(19, 34, 44, 0.26);
      font-weight: 800;
    }

    .client-fab span { font-size: 22px; line-height: 1; }

    .breadcrumb {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .subline,
    .section-title p,
    .hero p {
      overflow-wrap: anywhere;
    }

    .workspace-frame {
      width: 100%;
      margin: 0 auto;
      display: grid;
      gap: 12px;
      max-width: var(--workspace-width);
    }

    .workspace-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .sidebar-stack {
      display: grid;
      gap: 10px;
      margin-top: auto;
    }

    .profile-card,
    .quick-link-widget {
      padding: 12px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.82);
      border: 1px solid rgba(216, 212, 202, 0.95);
    }

    .mobile-utility-bar {
      margin-top: 12px;
      display: grid;
      gap: 10px;
    }

    .mobile-utility-card {
      padding: 12px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.86);
      border: 1px solid rgba(216, 212, 202, 0.95);
    }

    .mobile-utility-card strong {
      display: block;
      margin-top: 3px;
      font-size: 15px;
    }

    .mobile-summary-row {
      display: none;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid rgba(216, 212, 202, 0.95);
    }

    .mobile-summary-main {
      min-width: 0;
    }

    .mobile-summary-title {
      font-size: 14px;
      font-weight: 700;
      line-height: 1.25;
    }

    .mobile-summary-subtitle {
      margin-top: 2px;
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .mobile-summary-actions {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-shrink: 0;
    }

    .mobile-scope-panel {
      display: none;
      margin-top: 8px;
      padding: 10px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid rgba(216, 212, 202, 0.95);
    }

    .profile-name {
      margin-top: 4px;
      font-size: 16px;
      font-weight: 700;
    }

    .quick-link-widget .inline-controls {
      margin-top: 8px;
    }

    .points-widget {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      padding: 12px;
      border-radius: 18px;

      z-index: 0;

        radial-gradient(circle, rgba(255, 255, 255, 0.38) 0 1.8px, transparent 3px) 25px 31px / 71px 67px,
        radial-gradient(circle, rgba(186, 230, 253, 0.46) 0 2.8px, transparent 4px) 0 0 / 91px 83px,
        radial-gradient(circle, rgba(255, 255, 255, 0.2) 0 4px, transparent 5.5px) 46px 19px / 128px 112px;
      animation: particleDrift 18s linear infinite;
      pointer-events: none;
    }

    .points-widget::after {
      content: "";
      position: absolute;
      inset: -30% -10%;

    .wall-of-fame {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      padding: 22px;
      border-radius: 20px;
      background: linear-gradient(135deg, #172554, #2563eb 58%, #d4942f);
      color: white;
    }

    .wall-of-fame::before {
      content: "";
      position: absolute;
      inset: -20% auto -20% -45%;
      width: 34%;
      z-index: 0;
      background: linear-gradient(100deg, transparent 8%, rgba(255, 255, 255, 0.05) 30%, rgba(255, 238, 188, 0.32) 50%, rgba(255, 255, 255, 0.08) 70%, transparent 92%);
      transform: skewX(-18deg);
      animation: progressSweep 11s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      pointer-events: none;
    }

    .wall-of-fame::after {
      content: "";

      width: 190px;
      height: 190px;
      right: -70px;
      top: -80px;
      border: 24px solid rgba(255, 255, 255, 0.13);

    function queueWorkspaceSave(scope, payload = workspacePayload(scope)) {
      if (scope === "monthly_compliance") operationalPendingPayloads[scope] = { ...(operationalPendingPayloads[scope] || {}), ...structuredClone(payload) };
      else operationalPendingPayloads[scope] = structuredClone(payload);
      window.clearTimeout(operationalSaveTimers[scope]);
      setDatabaseStatus("updating");
      operationalSaveTimers[scope] = window.setTimeout(() => {
        const payloadToSave = operationalPendingPayloads[scope];
        operationalPendingPayloads[scope] = scope === "monthly_compliance" ? {} : null;
        const previousSave = operationalSaveQueues[scope] || Promise.resolve();
        const nextSave = previousSave.catch(() => {}).then(async () => {
          try {
            const response = await appFetch("/api/operations", { method: "PUT", headers: { "Content-Type": "application/json", Accept: "application/json" }, body: JSON.stringify({ scope, payload: payloadToSave, version: operationalVersions[scope] || 0 }) }, "");
            const result = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(result.error || "Workspace change could not be saved.");
            operationalVersions[scope] = result.data.version;
            clearSyncFailure(`${scope} workspace`);
            setDatabaseStatus("connected");
          } catch (error) {
            markSyncFailure(`${scope} workspace`, error);
            setDatabaseStatus("failed");
          }
        });
        operationalSaveQueues[scope] = nextSave;
      }, 700);

      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const days = Math.ceil((end - today) / 86400000);
      if (days < 0) return { label: "Expired", className: "danger", days };
      if (days <= 90) return { label: "Expiring soon", className: "warning", days };
      return { label: "Active", className: "accent", days };

    function performanceLeaderboard() {
      const rules = performanceRules();
      const byPic = new Map(ALL_PICS.map((pic) => [pic, {
        pic,
        monthly: 0,
        annualAccounting: 0,
        annualTax: 0,
        cases: 0,
        adjustments: 0,
        sources: []
      }]));
      const credit = (pic, bucket, points, source) => {
        if (!byPic.has(pic) || !points) return;
        const row = byPic.get(pic);
        row[bucket] += points;
        row.sources.push({ bucket, points, source });
      };

      clients.forEach((client) => {
        Object.values(client.obligations).forEach((obligation) => {
          const stage = obligationLedgerState(obligation);
          const points = stage === "completed" ? rules.monthlyCompleted
            : stage === "validated" ? rules.monthlyValidated
            : stage === "paid" ? rules.monthlyPaid
            : 0;
          credit(client.taxPic, "monthly", points, `${client.name} monthly compliance`);
        });
        if (clientDataState(client) === "received") {
          credit(client.accountingPic, "monthly", rules.dataReceived, `${client.name} data received`);
        }
      });

      annualAccountingRows.forEach((row) => {
        const rank = ANNUAL_PROGRESS_SORT_RANK[row.progress] || 0;
        const points = ["Reported", "Done"].includes(row.progress)
          ? rules.annualAccountingReported
          : Math.min(rules.annualAccountingStep * rank, 14);
        credit(row.accountingPic, "annualAccounting", points, `${row.clientName} annual accounting`);
      });

      annualTaxRows.forEach((row) => {
        const milestoneCount = [row.previousSpt, row.lifestyleAnalysis, row.assetReview, row.clientMeeting, row.finish, row.meeting, row.spt, row.bayar].filter(Boolean).length;
        const points = milestoneCount * rules.annualTaxMilestone + (row.reported ? rules.annualTaxReported : 0);
        credit(row.taxPic, "annualTax", points, `${row.clientName} annual tax`);
      });

      taxCases.forEach((item) => {
        const completedSteps = (item.nextSteps || []).filter((step) => step.done).length;
        credit(item.taxPic, "cases", completedSteps * rules.caseStepTax, `${item.clientName} case next steps`);
        credit(item.accountingPic, "cases", completedSteps * rules.caseStepAcc, `${item.clientName} case next steps`);
        if (item.stage !== "Closed") return;
        credit(item.taxPic, "cases", rules.caseClosedTax, `${item.clientName} closed case`);
        credit(item.accountingPic, "cases", rules.caseClosedAcc, `${item.clientName} closed case`);
        const onTime = item.closedAt && item.dueDate && item.closedAt <= item.dueDate;
        if (onTime) {
          credit(item.taxPic, "cases", rules.caseOnTimeTax, `${item.clientName} closed on time`);
          credit(item.accountingPic, "cases", rules.caseOnTimeAcc, `${item.clientName} closed on time`);
        }
      });

      state.performance.adjustments.forEach((adjustment) => {
        credit(adjustment.pic, "adjustments", Number(adjustment.points || 0), adjustment.reason || "Supervisor adjustment");
      });

      return [...byPic.values()]
        .map((row) => ({ ...row, total: row.monthly + row.annualAccounting + row.annualTax + row.cases + row.adjustments }))
        .sort((left, right) => right.total - left.total || compareText(left.pic, right.pic));
    }

    function scheduleAutoSearch(input) {
      const path = SEARCH_STATE_BY_INPUT[input.id];
      if (!path) return;
      const raw = input.value.trim();
      window.clearTimeout(searchDebounceTimer);
      if (!raw) {
        setSearchState(path, "");
        commitUi("replace");
        return;
      }
      searchDebounceTimer = window.setTimeout(() => {
        setSearchState(path, raw.length >= 3 ? raw : "");
        commitUi("replace");
        requestAnimationFrame(() => {
          const nextInput = document.getElementById(input.id);
          if (nextInput instanceof HTMLInputElement) {
            nextInput.focus();
            nextInput.setSelectionRange(nextInput.value.length, nextInput.value.length);
          }
        });

    function compareText(a, b) {

      completed: 1,
      validated: 2,
      paid: 3,
      calculated: 4,
      requested: 5,
      idle: 6,
      na: 7
    };

    const DATA_SORT_RANK = {
      received: 1,
      requesting: 2,
      missing: 3
    };

    const ANNUAL_PROGRESS_SORT_RANK = {
      "Data Request": 1,
      "In Process": 2,
      "Financials Done": 3,
      Equalization: 4,
      Review: 5,
      Meeting: 6,
      "SPT Ready": 7,

    function sortArrow(scope, key) {
      const sort = state.sorts[scope];

    function sortHeader(scope, key, label) {

    function compareDatesDisplay(a, b) {

      const bIso = parseDisplayDateToIso(b);

      if (bIso) return 1;
      return compareText(a, b);
    }

    function sortMonthlyClients(list) {
      const { key, dir } = state.sorts.monthly;
      const factor = dir === "asc" ? 1 : -1;
      return [...list].sort((left, right) => {
        let result = 0;
        if (key === "name") result = compareText(normalizedEntityName(left.name), normalizedEntityName(right.name));
        if (key === "taxPic") result = compareText(left.taxPic, right.taxPic);
        if (key === "accPic") result = compareText(left.accountingPic, right.accountingPic);
        if (key === "data") result = (DATA_SORT_RANK[clientDataState(left)] - DATA_SORT_RANK[clientDataState(right)]);
        if (OBLIGATIONS.includes(key)) result = (OBLIGATION_SORT_RANK[obligationLedgerState(left.obligations[key])] - OBLIGATION_SORT_RANK[obligationLedgerState(right.obligations[key])]);
        if (key === "updated") result = compareText(left.lastUpdated, right.lastUpdated);
        if (key === "attention") result = compareText((clientNeedsAttention(left)[0] || ""), (clientNeedsAttention(right)[0] || ""));
        if (result === 0) result = compareText(normalizedEntityName(left.name), normalizedEntityName(right.name));
        return result * factor;
      });
    }

    function sortAnnualAccountingRows(list) {
      const { key, dir } = state.sorts.annualAccounting;
      const factor = dir === "asc" ? 1 : -1;
      return [...list].sort((left, right) => {
        let result = 0;
        if (key === "name") result = compareText(normalizedEntityName(left.clientName), normalizedEntityName(right.clientName));
        if (key === "contract") result = compareText(left.contractType, right.contractType);
        if (key === "priority") result = Number(left.priority || 0) - Number(right.priority || 0);
        if (key === "status") result = compareText(left.accountingStatus, right.accountingStatus);
        if (key === "form") result = compareText(left.businessType, right.businessType);
        if (key === "assist") result = compareText(left.assist, right.assist);
        if (key === "picAcc") result = compareText(left.accountingPic, right.accountingPic);
        if (key === "picTax") result = compareText(left.taxPic, right.taxPic);
        if (key === "progress") result = (ANNUAL_PROGRESS_SORT_RANK[left.progress] || 999) - (ANNUAL_PROGRESS_SORT_RANK[right.progress] || 999);
        if (key === "deadline") result = compareDatesDisplay(left.deadline === "CUT OFF" ? "99/99/9999" : left.deadline, right.deadline === "CUT OFF" ? "99/99/9999" : right.deadline);
        if (key === "lapor") result = compareDatesDisplay(left.lapor, right.lapor);
        if (key === "ntpe") result = compareText(left.ntpe, right.ntpe);
        if (result === 0) result = compareText(normalizedEntityName(left.clientName), normalizedEntityName(right.clientName));
        return result * factor;
      });
    }

    function sortAnnualTaxRows(list) {
      const { key, dir } = state.sorts.annualTax;
      const factor = dir === "asc" ? 1 : -1;
      return [...list].sort((left, right) => {
        let result = 0;
        if (key === "name") result = compareText(normalizedEntityName(left.clientName), normalizedEntityName(right.clientName));
        if (key === "status") result = compareText(left.status, right.status);
        if (key === "group") result = compareText(left.groupName, right.groupName);

        if (result === 0) result = compareText(normalizedEntityName(left.clientName), normalizedEntityName(right.clientName));
        return result * factor;
      });

    function parseCsv(text) {
      const rows = [];
      let current = "";
      let row = [];
      let inQuotes = false;
      const pushCell = () => {
        row.push(current);
        current = "";
      };
      const pushRow = () => {
        if (row.length || current) {
          pushCell();
          rows.push(row);
          row = [];
        }
      };

      for (let i = 0; i < text.length; i += 1) {
        const char = text[i];
        const next = text[i + 1];

        if (char === "\"") {
          if (inQuotes && next === "\"") {
            current += "\"";
            i += 1;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (char === "," && !inQuotes) {
          pushCell();
        } else if ((char === "\n" || char === "\r") && !inQuotes) {
          if (char === "\r" && next === "\n") i += 1;
          pushRow();
        } else {
          current += char;
        }
      }
      pushRow();

      const [headerRow, ...dataRows] = rows.filter((item) => item.some((cell) => String(cell).trim() !== ""));
      if (!headerRow) return [];
      const headers = headerRow.map((cell) => String(cell).trim());
      return dataRows.map((cells) => headers.reduce((acc, header, index) => {
        acc[header] = (cells[index] || "").trim();
        return acc;
      }, {}));
    }

    function clientNeedsAttention(client) {
      const reasons = [];
      const dataState = clientDataState(client);
      const values = Object.values(client.obligations).map((item) => obligationLedgerState(item));
      if (dataState === "missing") reasons.push("Data missing");
      if (dataState === "requesting") reasons.push("Data requested");
      if (values.some((item) => item === "requested")) reasons.push("Data requested");
      if (values.some((item) => item === "idle")) reasons.push("Not handled");
      if (values.some((item) => item === "calculated")) reasons.push("Awaiting payment");
      if (values.some((item) => item === "paid")) reasons.push("Awaiting NTPN");
      if (values.some((item) => item === "validated")) reasons.push("Awaiting report");
      if (client.followUpCount > 3) reasons.push("High follow-up burden");
      if (client.claimStatus === "Draft" || client.claimStatus === "Billing Ready") reasons.push("Claim workflow not advanced");
      if (!client.billingUploaded) reasons.push("Billing PDF not uploaded");
      return reasons;
    }

      const paymentDone = ["Waiting Reporting Finalization", "Reported"].includes(client.paymentStatus);

    function blendHex(hex, target, amount) {
      const source = String(hex || "#2563eb").replace("#", "");
      const rgb = [0, 2, 4].map((index) => parseInt(source.slice(index, index + 2), 16));
      const blended = rgb.map((value, index) => Math.round(value + (target[index] - value) * amount));
      return `#${blended.map((value) => value.toString(16).padStart(2, "0")).join("")}`;
    }

    function hexToRgba(hex, alpha) {
      const source = String(hex || "#2563eb").replace("#", "");
      const channels = [0, 2, 4].map((index) => parseInt(source.slice(index, index + 2), 16));
      return `rgba(${channels.join(", ")}, ${alpha})`;
    }

    function formatRupiahInput(value) {
      const digits = String(value || "").replace(/\D/g, "");
      if (!digits) return "";
      const number = Number(digits);
      return new Intl.NumberFormat("id-ID", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      }).format(number);
    }

    function extractRupiahNumber(value) {
      const raw = String(value || "").trim();
      if (!raw) return 0;
      const normalized = raw.replace(/\s/g, "");
      if (normalized.includes(",")) {
        const [wholePart] = normalized.split(",");
        const wholeDigits = wholePart.replace(/\D/g, "");
        return wholeDigits ? Number(wholeDigits) : 0;
      }
      const digits = normalized.replace(/\D/g, "");
      return digits ? Number(digits) : 0;
    }

    function formatDateDraft(value) {
      const digits = String(value || "").replace(/\D/g, "").slice(0, 8);
      const day = digits.slice(0, 2);
      const month = digits.slice(2, 4);
      const year = digits.slice(4, 8);
      return [day, month, year].filter(Boolean).join("/");
    }

    function formatIsoToDisplayDate(value) {
      if (!value) return "";
      const match = String(value).match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if (!match) return value;
      const [, year, month, day] = match;
      return `${day}/${month}/${year}`;
    }

    function parseDisplayDateToIso(value) {
      const match = String(value || "").match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
      if (!match) return "";
      const [, day, month, year] = match;
      const dayNum = Number(day);
      const monthNum = Number(month);
      const yearNum = Number(year);
      if (dayNum < 1 || dayNum > 31 || monthNum < 1 || monthNum > 12 || yearNum < 2000) return "";
      return `${year}-${month}-${day}`;
    }

    function ledgerDateDisplayValue(item) {
      return item.paidDateDraft || formatIsoToDisplayDate(item.paidDate) || "";
    }

    function updateLedgerField(clientId, obligationKey, fieldKey, rawValue, shouldCommit = false) {
      const client = clients.find((item) => item.id === clientId);
      if (!client) return;
      const obligation = client.obligations[obligationKey];
      if (fieldKey === "payable") {
        obligation.payableAmount = extractRupiahNumber(rawValue);
      }
      if (fieldKey === "date") {
        obligation.paidDateDraft = rawValue;
        const iso = parseDisplayDateToIso(rawValue);
        obligation.paidDate = iso;
        if (!rawValue) obligation.paidDate = "";
      }
      if (fieldKey === "ntpn") {
        obligation.receiptNumber = String(rawValue || "").trim();
      }
      if (fieldKey === "detail") {
        obligation.taxBreakdown = String(rawValue || "").trim();
      }
      client.lastUpdated = "2026-05-21 11:05";
      if (isClientCompleted(client)) {
        state.completionPromptClientId = client.id;
      }
      if (shouldCommit) {
        commitUi("replace");
      }
    }

    async function markAnnouncementRead(id) {
      const item = state.announcements.find((announcement) => announcement.id === id);
      if (!item) return;
      const previousReadAt = item.readAt;
      // Remove the item immediately. The server acknowledgement continues in
      // the background, so opening the inbox always feels instantaneous.
      item.readAt = new Date().toISOString();
      renderAnnouncementInbox();
      try {
        const response = await appFetch("/api/announcements", { method: "PATCH", headers: { "Content-Type": "application/json", Accept: "application/json" }, body: JSON.stringify({ announcementId: id }) });
        if (!response.ok) throw new Error("Announcement could not be marked as read.");
        clearSyncFailure("Announcement read status");
      } catch (error) {
        item.readAt = previousReadAt;
        renderAnnouncementInbox();
        markSyncFailure("Announcement read status", error);
        console.warn("[announcements] read update failed", error);
      }
    }

    function selectedClient() {
      return clients.find((client) => client.id === state.selectedClientId) || visibleClients()[0] || clients[0];

    function clientPortfolioSnapshot() {
      const activeClients = clients.filter((client) => client.clientStatus === "Active");
      const portfolio = activeClients.length ? activeClients : clients;
      const monthlyFee = portfolio.reduce((sum, client) => sum + Number(client.serviceFee || 0), 0);
      const annualFee = portfolio.reduce((sum, client) => sum + Number(client.annualFee || annualFeeFromMonthly(client.serviceFee)), 0);
      const coveredPICS = new Set(portfolio.flatMap((client) => [client.taxPic, client.accountingPic]).filter(Boolean));
      const picWorkload = ALL_PICS.map((pic) => ({
        pic,
        clients: portfolio.filter((client) => client.taxPic === pic || client.accountingPic === pic).length
      })).filter((row) => row.clients > 0).sort((left, right) => right.clients - left.clients || compareText(left.pic, right.pic));
      const industryCounts = Object.entries(portfolio.reduce((counts, client) => {
        const industry = client.industry || "Unclassified";
        counts[industry] = (counts[industry] || 0) + 1;
        return counts;
      }, {})).map(([label, count]) => ({ label, count })).sort((left, right) => right.count - left.count || compareText(left.label, right.label));
      const statusCounts = Object.entries(clients.reduce((counts, client) => {
        const status = client.clientStatus || "Unclassified";
        counts[status] = (counts[status] || 0) + 1;
        return counts;
      }, {})).map(([label, count]) => ({ label, count })).sort((left, right) => right.count - left.count || compareText(left.label, right.label));
      const expiringContracts = portfolio.filter((client) => contractHealth(client).label === "Expiring soon").length;
      return { activeClients, portfolio, monthlyFee, annualFee, coveredPICS, picWorkload, industryCounts, statusCounts, expiringContracts };
    }

    function windowedRows(rows, tableId, rowHeight) {
      const requestedStart = Number(state.tableViewport[tableId] || 0);
      const pageSize = 56;
      const start = Math.max(0, Math.min(requestedStart, Math.max(0, rows.length - pageSize)));
      const end = Math.min(rows.length, start + pageSize);
      return {
        start,
        rows: rows.slice(start, end),
        top: start * rowHeight,
        bottom: Math.max(0, rows.length - end) * rowHeight
      };
    }

    function virtualSpacer(columns, height) {
      if (!height) return "";
      return `<tr class="virtual-spacer" aria-hidden="true" style="--virtual-height:${height}px"><td colspan="${columns}"></td></tr>`;
    }

    function updateVirtualTableViewport(wrap) {
      const tableId = wrap.getAttribute("data-virtual-table");
      const rowHeight = Number(wrap.getAttribute("data-row-height") || 44);
      if (!tableId || !rowHeight) return;
      const targetStart = Math.max(0, Math.floor(wrap.scrollTop / rowHeight) - 12);
      const currentStart = Number(state.tableViewport[tableId] || 0);
      state.virtualScrollTop = state.virtualScrollTop || {};
      state.virtualScrollTop[tableId] = wrap.scrollTop;
      // Always retain the user's latest scroll position, even when the
      // render window has enough buffer and does not need moving yet.
      if (Math.abs(targetStart - currentStart) < 8) return;
      state.tableViewport[tableId] = targetStart;
      if (state.virtualRenderFrame) return;
      state.virtualRenderFrame = window.requestAnimationFrame(() => {
        state.virtualRenderFrame = 0;
        if (state.currentView !== "client-management-view") return;
        // Build the next row window off-screen, then replace only tbody.
        // Keeping the scroll container in place prevents a visible jump to
        // row one while a large client list is being virtualized.
        const scratch = document.createElement("div");
        renderClientManagement(scratch);
        const nextBody = scratch.querySelector(`[data-virtual-table="${tableId}"] tbody`);
        const currentBody = wrap.querySelector("tbody");
        if (nextBody && currentBody) currentBody.replaceWith(nextBody);
        else renderClientManagement();
        wrap.scrollTop = state.virtualScrollTop?.[tableId] || 0;
      });
    }

    function triggerPointsBurst(widget, pointsTotal, gained) {
      let field = widget.querySelector(".points-bubble-field");
      if (!field) {
        field = document.createElement("div");
        field.className = "points-bubble-field";
        field.setAttribute("aria-hidden", "true");
        widget.appendChild(field);
      }

      field.replaceChildren();
      const bubbleSizes = [7, 10, 13, 17, 9, 15, 11, 20, 8];
      bubbleSizes.forEach((size, index) => {
        const bubble = document.createElement("span");
        bubble.className = "points-bubble";
        bubble.style.setProperty("--bubble-size", `${size}px`);
        bubble.style.setProperty("--bubble-left", `${8 + ((index * 11) % 80)}%`);
        bubble.style.setProperty("--bubble-delay", `${index * 0.055}s`);
        bubble.style.setProperty("--bubble-drift", `${index % 2 === 0 ? -1 : 1}0px`);
        field.appendChild(bubble);
      });

      pointsTotal.classList.remove("points-increased");
      void pointsTotal.offsetWidth;
      pointsTotal.classList.add("points-increased");
      window.setTimeout(() => {
        pointsTotal.classList.remove("points-increased");
        field.replaceChildren();
      }, 1600);
      widget.setAttribute("aria-label", `Monthly performance points increased by ${gained}`);
    }

    function syncIssueKey(scope) {
      return String(scope || "Update").replace(/\s+/g, " ").trim();
    }

    function markSyncFailure(scope, error) {
      const key = syncIssueKey(scope);
      const message = error instanceof Error ? error.message : String(error || "Unknown save error");
      state.syncIssues = [...state.syncIssues.filter((issue) => issue.scope !== key), { scope: key, message, at: Date.now() }];
      renderDatabaseSyncStatus();
      persistDemoState();
    }

    function clearSyncFailure(scope) {
      const key = syncIssueKey(scope);
      const before = state.syncIssues.length;
      state.syncIssues = state.syncIssues.filter((issue) => issue.scope !== key);
      if (before !== state.syncIssues.length) persistDemoState();
      renderDatabaseSyncStatus();
    }

    function renderDatabaseSyncStatus() {
      const chip = document.getElementById("database-status-chip");
      if (!chip) return;
      if (appLoadingRequests > 0) {
        chip.textContent = `Database: saving${appLoadingRequests > 1 ? ` (${appLoadingRequests})` : "..."}`;
        chip.className = "database-status-chip is-updating";
        chip.title = "Changes are saving in the background. You can continue working.";
        return;
      }
      if (state.syncIssues.length) {
        chip.textContent = `Database: needs attention (${state.syncIssues.length})`;
        chip.className = "database-status-chip is-warning";
        chip.title = state.syncIssues.map((issue) => `${issue.scope}: ${issue.message}`).join("\n");
        return;
      }
      const baseStatus = databaseHealthStatus || databaseStatusBeforeUpdate;
      if (baseStatus) {
        chip.textContent = baseStatus.text;
        chip.className = baseStatus.className;
        chip.title = baseStatus.title;
      }
    }

    function setAppLoading(visible) {
      const overlay = document.getElementById("app-loading-overlay");
      // Global blocking overlays interrupt data entry. Keep the element hidden
      // and use the database chip as a lightweight background-sync indicator.
      if (overlay) overlay.classList.remove("visible");
      if (visible) {
        const chip = document.getElementById("database-status-chip");
        if (chip && !databaseStatusBeforeUpdate) {
          databaseStatusBeforeUpdate = { text: chip.textContent, className: chip.className, title: chip.title };
        }
        renderDatabaseSyncStatus();
        return;
      }
      renderDatabaseSyncStatus();
    }

    async function appFetch(url, options, message = "", { trackUpdate = true } = {}) {
      const method = String(options?.method || "GET").toUpperCase();
      const isDatabaseUpdate = trackUpdate && ["POST", "PATCH", "PUT", "DELETE"].includes(method);
      if (isDatabaseUpdate) {
        appLoadingRequests += 1;
        setAppLoading(true);
      }
      try {
        // Opening public/demo.html directly uses file://, where relative API
        // requests are unavailable. Keep that path usable as an offline demo.
        if (window.location.protocol === "file:") {
          return new Response(JSON.stringify({ error: "Offline demo mode" }), { status: 503, headers: { "Content-Type": "application/json" } });
        }
        return await fetch(url, options);
      } finally {
        if (isDatabaseUpdate) {
          appLoadingRequests = Math.max(0, appLoadingRequests - 1);
          if (!appLoadingRequests) setAppLoading(false);
        }
      }
    }

        if (!response.ok) {

        const rows = Array.isArray(result.data) ? result.data : [];
        const mapped = rows.map(databaseClientToDemo);
        clientMasterClients = mapped.filter((client) => client.clientStatus !== "Proposal");
        // A client-master refresh must not replace the in-progress monthly
        // snapshot, otherwise a later autosave can erase queue progress.
        clients = state.activeMonthlyPeriod && state.monthlyProgress[state.activeMonthlyPeriod]
          ? structuredClone(state.monthlyProgress[state.activeMonthlyPeriod])
          : structuredClone(clientMasterClients);

          proposedAccPic: client.accountingPic,
          obligations: OBLIGATIONS.filter((key) => client.obligations[key].status !== "na"),
          monthlyFee: client.serviceFee,
          annualFee: client.annualFee,
          status: client.proposalStatus || "New Lead"

        if (!clients.some((client) => client.id === state.selectedClientId)) state.selectedClientId = clients[0]?.id || "";

      record.id = saved.id;

      if (acceptServerDerivedFields && !record.keepLocalDerivedFields) record.dueDate = saved.dueDate;

    function replaceInlineCaseId(previousId, record) {
      if (previousId === record.id) return;
      document.querySelectorAll("[data-case-inline]").forEach((input) => {
        if (input.getAttribute("data-case-inline") === previousId) input.setAttribute("data-case-inline", record.id);
      });
    }

    function syncInlineCaseOwnership(record) {
      const linkedClient = clients.find((client) => normalizedEntityName(client.name) === normalizedEntityName(record.clientName));
      record.clientId = linkedClient?.id || "";
      record.databaseClientId = linkedClient?.databaseId || "";
      record.taxPic = linkedClient?.taxPic || "";
      record.accountingPic = linkedClient?.accountingPic || "";
      const escapedId = window.CSS?.escape ? window.CSS.escape(record.id) : record.id;
      document.querySelectorAll(`[data-case-pic-tax="${escapedId}"]`).forEach((cell) => { cell.textContent = record.taxPic || "-"; });
      document.querySelectorAll(`[data-case-pic-acc="${escapedId}"]`).forEach((cell) => { cell.textContent = record.accountingPic || "-"; });
      return linkedClient;
    }

    function saveInlineHimbauanCase(record, field, value) {
      record[field] = value;
      if (field === "clientName") {
        syncInlineCaseOwnership(record);
      }
      if (field === "receivedDate" && (record.caseCategory || "Himbauan") === "Himbauan") {
        if (record.receivedDate) {
          const due = new Date(`${record.receivedDate}T00:00:00`);
          due.setDate(due.getDate() + 14);
          record.dueDate = due.toISOString().slice(0, 10);
        } else {
          record.dueDate = "";
        }
      }
      refreshInlineHimbauanRow(record);
      persistDemoState();
      record.inlineRevision = Number(record.inlineRevision || 0) + 1;

      // Batch nearby edits and serialize each case's requests. Inline fields
      // never repaint the table or use the full-screen loader while saving.
      window.clearTimeout(inlineCaseSaveTimers.get(record));
      const timer = window.setTimeout(() => {
        const previousSave = inlineCaseSaveQueues.get(record) || Promise.resolve();
        const nextSave = previousSave.catch(() => {}).then(async () => {
          // A new row is retained locally until Wajib Pajak is supplied, because
          // the database requires a client name for every case record.
          if (record.id.startsWith("case-") && !record.clientName.trim()) return;
          const previousId = record.id;
          const saveRevision = record.inlineRevision;
          record.keepLocalDerivedFields = true;
          try {
            await saveCaseToDatabase(record, { showLoading: false });
          } finally {
            delete record.keepLocalDerivedFields;
          }
          replaceInlineCaseId(previousId, record);
          // Do not overwrite a newer received date with an older response.
          if (saveRevision !== record.inlineRevision) return;
          delete record.pendingSync;
          refreshInlineHimbauanRow(record);
          persistDemoState();
        }).catch((error) => {
          // Preserve the edit locally. The next inline change retries it without
          // interrupting the user's data entry with a blocking browser alert.
          record.pendingSync = true;
          persistDemoState();
          console.warn("[cases] inline save failed", error);
        });
        inlineCaseSaveQueues.set(record, nextSave);
      }, 750);
      inlineCaseSaveTimers.set(record, timer);
    }

    function myWorkPayload(task, extra = {}) {
      return {
        id: task.id?.startsWith("task-") ? "" : task.id,
        title: task.title,

        steps: task.steps || [],
        reminder: task.reminder || "",
        dueDate: task.dueDate || "",
        repeatRule: task.repeatRule || "none",

    async function loadSharedMyWork(background = false) {
      try {
        const response = await appFetch("/api/my-work", { cache: "no-store", headers: { Accept: "application/json" } }, background ? "" : "Loading My Work...");
        if (!response.ok) return;
        const result = await response.json();
        const tasks = Array.isArray(result.tasks) ? result.tasks : [];
        // Keep tasks waiting for their first successful POST. A transient API
        // failure must never make a task disappear when the shared list reloads.
        const pendingTasks = state.myWork.filter((task) => task.pendingSync || task.id?.startsWith("task-"));
        const sharedIds = new Set(tasks.map((task) => task.id));
        const pendingById = new Map(pendingTasks.map((task) => [task.id, task]));
        state.myWork = [
          ...pendingTasks.filter((task) => !sharedIds.has(task.id)),
          ...tasks.map((task) => pendingById.get(task.id) || task)
        ];
        myWorkLoadedFromDatabase = true;
        if (!state.myWork.some((task) => task.id === state.selectedMyWorkId)) state.selectedMyWorkId = state.myWork[0]?.id || "";
        renderAfterSharedDataUpdate(["my-work-view"]);
        pendingTasks.forEach((task) => {
          if (!sharedIds.has(task.id)) saveMyWorkTaskToDatabase(task);
        });
      } catch (error) {
        console.warn("[my-work] shared load failed", error);
      }
    }

    const myWorkSaveQueues = new WeakMap();

    function saveMyWorkTaskToDatabase(task, extra = {}) {
      task.syncRevision = Number(task.syncRevision || 0) + 1;
      const revision = task.syncRevision;
      const previousSave = myWorkSaveQueues.get(task) || Promise.resolve();
      const nextSave = previousSave.catch(() => {}).then(async () => {
        const creating = task.id?.startsWith("task-");
        const previousId = task.id;
        try {
          // Build the payload after the previous save completes. This turns a
          // rapid create + edit sequence into POST then PATCH, never two POSTs.
          const response = await appFetch("/api/my-work", {
            method: creating ? "POST" : "PATCH",
            headers: { "Content-Type": "application/json", Accept: "application/json" },
            body: JSON.stringify(creating ? { ...myWorkPayload(task), assignees: task.assignees || [] } : myWorkPayload(task, extra))
          }, "");
          const result = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(result.error || "My Work could not be saved.");
          if (result.task?.id && creating) {
            task.id = result.task.id;
            task.createdAt = result.task.createdAt || task.createdAt;
            task.createdAtText = result.task.createdAtText || task.createdAtText;
            task.creatorName = result.task.creatorName || task.creatorName;
            if (state.selectedMyWorkId === previousId) state.selectedMyWorkId = task.id;
            if (state.newMyWorkTaskId === previousId) state.newMyWorkTaskId = task.id;
          }
          // Do not replace task fields from an old response; a newer edit may
          // already be present locally and will be saved by the queued request.
          delete task.pendingSync;
          clearSyncFailure(`Task ${task.title || "untitled"}`);
          persistDemoState();
          if (state.currentView === "my-work-view" && !activeEditorSnapshot()) rerender();
          if (!creating && task.done) loadSharedMyWork(true);
        } catch (error) {
          task.pendingSync = true;
          markSyncFailure(`Task ${task.title || "untitled"}`, error);
          persistDemoState();
          console.warn("[my-work] save failed", error);
        }
      });
      myWorkSaveQueues.set(task, nextSave);
      return nextSave;
    }

    async function deleteAnnouncementFromHistory(id) {
      const item = state.announcements.find((announcement) => announcement.id === id);
      if (!item) return;
      state.announcements = state.announcements.filter((announcement) => announcement.id !== id);
      renderProfile();
      try {
        const response = await appFetch("/api/announcements", { method: "DELETE", headers: { "Content-Type": "application/json", Accept: "application/json" }, body: JSON.stringify({ announcementId: id }) }, "", { trackUpdate: false });
        const result = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(result.error || "Announcement could not be deleted.");
        state.deletedAnnouncements.unshift({ ...item, deletedAt: new Date().toISOString() });
        renderShellChrome();
      } catch (error) {
        state.announcements.unshift(item);
        markSyncFailure("Announcement deletion", error);
        renderProfile();
      }
    }

    async function restoreAnnouncementFromHistory(id) {
      const response = await appFetch("/api/announcements", { method: "PATCH", headers: { "Content-Type": "application/json", Accept: "application/json" }, body: JSON.stringify({ announcementId: id, action: "restore" }) });
      const result = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(result.error || "Announcement could not be restored.");
      const item = state.deletedAnnouncements.find((announcement) => announcement.id === id);
      state.deletedAnnouncements = state.deletedAnnouncements.filter((announcement) => announcement.id !== id);
      if (item) state.announcements.unshift({ ...item, deletedAt: null });
      renderProfile();
      renderShellChrome();
    }

    async function loadStaffDirectory(background = false) {
      try {
        const response = await appFetch("/api/staff", { cache: "no-store", headers: { Accept: "application/json" } }, background ? "" : "Loading staff directory...");
        if (!response.ok) return;
        const result = await response.json();
        const staff = Array.isArray(result.staff) ? result.staff : [];
        if (!staff.length) return;
        staffDirectory = staff;
        const picName = (item) => item.display_name || item.full_name;
        const names = (items) => [...new Set(items.map(picName).filter(Boolean))];
        const canonicalPic = (value) => String(value || "").trim().toLowerCase().replace(/\s+/g, " ");
        const aliases = new Map(staff.flatMap((item) => [
          [canonicalPic(item.full_name), picName(item)],
          [canonicalPic(item.display_name), picName(item)]
        ]));
        const normalizePic = (value) => {
          const source = canonicalPic(value);
          if (!source) return value;
          const direct = aliases.get(source);
          if (direct) return direct;
          // Older rows can contain a legal name while the saved display name is shorter.
          const matchingStaff = staff.find((item) => {
            const display = canonicalPic(item.display_name);
            return display.length >= 4 && (source.includes(display) || display.includes(source));
          });
          return matchingStaff ? picName(matchingStaff) : value;
        };
        clients.forEach((client) => {
          client.pic = normalizePic(client.pic);
          client.taxPic = normalizePic(client.taxPic);
          client.accountingPic = normalizePic(client.accountingPic);
          client.partner = normalizePic(client.partner);
          client.supervisor = normalizePic(client.supervisor);
        });
        proposals.forEach((proposal) => {
          proposal.proposedPic = normalizePic(proposal.proposedPic);
          proposal.proposedAccPic = normalizePic(proposal.proposedAccPic);
        });
        taxCases.forEach((item) => {
          item.taxPic = normalizePic(item.taxPic);
          item.accountingPic = normalizePic(item.accountingPic);
        });
        annualAccountingRows.forEach((row) => {
          row.accountingPic = normalizePic(row.accountingPic);
          row.taxPic = normalizePic(row.taxPic);
        });
        annualTaxRows.forEach((row) => {
          row.reportPic = normalizePic(row.reportPic);
          row.taxPic = normalizePic(row.taxPic);
        });
        Object.values(state.allocationDrafts).forEach((draft) => {
          if (!draft || typeof draft !== "object") return;
          draft.nextAccPic = normalizePic(draft.nextAccPic);
          draft.nextTaxPic = normalizePic(draft.nextTaxPic);
        });
        // Partners supervise the portfolio but are not operational PIC choices.
        ACC_PICS = names(staff.filter((item) => item.team_division === "Accounting Team" && item.role !== "partner"));
        TAX_PICS = names(staff.filter((item) => item.team_division === "Tax Team" && item.role !== "partner"));
        ALL_PICS = [...new Set([...ACC_PICS, ...TAX_PICS])];
        PARTNERS = names(staff.filter((item) => item.role === "partner"));
        SUPERVISORS = names(staff.filter((item) => item.role === "supervisor"));
        staffDirectoryLoaded = true;
        rerender();
      } catch (error) {
        console.warn("[staff directory] request failed", error);
        // Keep fallback demo lists when the directory is temporarily unavailable.
      }
    }

      const id = active.id;
      const inlineId = active.getAttribute("data-case-inline");
      const field = active.getAttribute("data-case-field");
      if (!id && !inlineId) return null;
      return {
        id,
        inlineId,
        field,
        start: "selectionStart" in active ? active.selectionStart : null,
        end: "selectionEnd" in active ? active.selectionEnd : null
      };
    }

    function restoreActiveEditor(snapshot) {
      if (!snapshot) return;
      const escapedId = window.CSS?.escape ? window.CSS.escape(snapshot.id || "") : snapshot.id;
      const selector = snapshot.id
        ? `#${escapedId}`
        : `[data-case-inline="${escapeAttr(snapshot.inlineId)}"][data-case-field="${escapeAttr(snapshot.field)}"]`;
      const field = document.querySelector(selector);
      if (!(field instanceof HTMLInputElement || field instanceof HTMLTextAreaElement || field instanceof HTMLSelectElement)) return;
      field.focus({ preventScroll: true });
      if (snapshot.start !== null && "setSelectionRange" in field) field.setSelectionRange(snapshot.start, snapshot.end);
    }

      const index = rows.indexOf(row);
      const next = rows[index + (event.key === "ArrowDown" ? 1 : -1)];

        const duplicateIds = group.clients.map((client) => client.id).filter((id) => id && id !== canonicalId);

        try {
          const response = await appFetch("/api/clients/duplicates", { method: "PATCH", headers: { "Content-Type": "application/json", Accept: "application/json" }, body: JSON.stringify({ canonicalId, duplicateIds }) }, "");
          const result = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(result.error || "Duplicate records could not be resolved.");
          await loadSharedClients();
          const refreshed = await appFetch("/api/clients/duplicates", { cache: "no-store", headers: { Accept: "application/json" } }, "");

          state.duplicateReview = refreshed.ok ? refreshedResult.groups || [] : null;
          rerender();
          window.alert(`Deleted ${result.deleted || 0} duplicate record(s).`);
        } catch (error) {
          window.alert(error instanceof Error ? error.message : "Duplicate records could not be resolved.");
        }
        return;

      if (resolveSelectedDuplicatesTrigger) {
        const selectedIndexes = [...document.querySelectorAll("[data-duplicate-group-select]:checked")]

        if (!selectedIndexes.length) {
          window.alert("Select at least one duplicate group first.");
          return;

        const actions = selectedIndexes.map((groupIndex) => {
          const group = state.duplicateReview?.[groupIndex];
          const selected = document.querySelector(`input[name="duplicate-keep-${groupIndex}"]:checked`);
          const canonicalId = selected instanceof HTMLInputElement ? selected.value : "";
          return group && canonicalId ? { canonicalId, duplicateIds: group.clients.map((client) => client.id).filter((id) => id && id !== canonicalId) } : null;
        }).filter((action) => action?.duplicateIds.length);
        if (!actions.length || !window.confirm(`Delete duplicate copies from ${actions.length} selected group(s)? A recovery backup is retained for three days.`)) return;
        try {
          const response = await appFetch("/api/clients/duplicates", { method: "PATCH", headers: { "Content-Type": "application/json", Accept: "application/json" }, body: JSON.stringify({ action: "resolve-batch", actions }) }, "");
          const result = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(result.error || "Duplicate records could not be resolved.");
          await loadSharedClients();
          const refreshed = await appFetch("/api/clients/duplicates", { cache: "no-store", headers: { Accept: "application/json" } }, "");

          state.duplicateReview = [];

        state.selectedObligationKey = obligationKey;
        client.lastUpdated = "2026-05-21 09:10";

      const file = event.target.files && event.target.files[0];
      if (!file) return;

      try {
        const form = new FormData();
        form.append("file", file);
        const parsed = await appFetch("/api/clients/parse-import", { method: "POST", body: form }, "");
        const parsedResult = await parsed.json().catch(() => ({}));
        if (!parsed.ok) throw new Error(parsedResult.error || "Import file could not be read.");
        const imported = (parsedResult.rows || [])
          .filter((row) => (row.name || "").trim())
          .map((row) => createClientFromRow(row, { useDefaults: false }));

        if (!imported.length) {
          window.alert("No valid client rows found. Use the file exported from this menu and keep the clientCode column.");
          return;
        }
        const validated = await appFetch("/api/clients", {
          method: "POST",
          headers: { "Content-Type": "application/json", Accept: "application/json" },
          body: JSON.stringify({ operation: "validate-import", clients: imported })
        }, "");
        const validationResult = await validated.json().catch(() => ({}));
        if (!validated.ok) throw new Error(validationResult.error || "Import preview could not be validated.");
        state.importPreview = { fileName: file.name, clients: imported, validation: validationResult.validation || [], summary: validationResult.summary || {} };
        rerender();
      } catch (error) {
        window.alert(error instanceof Error ? error.message : "Import preview could not be prepared.");
      } finally {
        event.target.value = "";
      }
    });

    window.addEventListener("popstate", (event) => {
      applyHistorySnapshot(event.state);
      rerender();
      persistDemoState();
    });

    document.addEventListener("mouseover", (event) => {
      const target = event.target instanceof Element ? event.target : null;
      if (!target) return;
      const noteTrigger = target.closest("[data-open-notes]");
      if (!noteTrigger || state.notesPopupTarget) return;
      showNoteHoverPreview(noteTrigger, noteTrigger.getAttribute("data-note-preview"));
    });

    document.addEventListener("dblclick", async (event) => {
      const target = event.target instanceof HTMLInputElement ? event.target : null;
      if (!target) return;
      const dateTarget = target.closest("[data-ledger-date]");
      if (!dateTarget) return;
      const value = target.value.trim();
      if (!value) return;
      state.dateDragValue = value;
      state.dateDragSourceId = target.id;
      state.dateDragArmed = true;
      state.dateDragActive = false;
      try {
        await navigator.clipboard.writeText(value);
      } catch {}
      target.select();
    });

    document.addEventListener("mousedown", (event) => {
      const target = event.target instanceof HTMLInputElement ? event.target : null;
      if (!target) return;
      const dateTarget = target.closest("[data-ledger-date]");
      if (!dateTarget || !state.dateDragArmed || !state.dateDragValue) return;
      if (target.id === state.dateDragSourceId) return;
      state.dateDragActive = true;
      const match = target.id.match(/^ob-(client-\d+)-(pph21|unifikasi|pph25|phrpb1|ppn)-date$/);
      if (!match) return;
      const [, clientId, obligationKey] = match;
      target.value = state.dateDragValue;
      updateLedgerField(clientId, obligationKey, "date", target.value, false);
    });

    document.addEventListener("mouseover", (event) => {
      const target = event.target instanceof HTMLInputElement ? event.target : null;
      if (!target || !state.dateDragValue || !state.dateDragActive) return;
      const dateTarget = target.closest("[data-ledger-date]");
      if (!dateTarget || target.id === state.dateDragSourceId) return;
      const match = target.id.match(/^ob-(client-\d+)-(pph21|unifikasi|pph25|phrpb1|ppn)-date$/);
      if (!match) return;
      const [, clientId, obligationKey] = match;
      target.value = state.dateDragValue;
      updateLedgerField(clientId, obligationKey, "date", target.value, false);
    });

    document.addEventListener("mouseout", (event) => {
      const target = event.target instanceof Element ? event.target : null;
      if (!target) return;
      const noteTrigger = target.closest("[data-open-notes]");
      if (!noteTrigger) return;
      const related = event.relatedTarget instanceof Element ? event.relatedTarget : null;
      if (related && related.closest("[data-open-notes]") === noteTrigger) return;
      hideNoteHoverPreview();
    });

    document.addEventListener("mouseup", () => {
      resetDateDragState(true);
    });

    window.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && event.target?.id === "my-work-title") {
        event.preventDefault();
        const title = event.target.value.trim();
        if (title) {
          const task = {
            id: `task-${Date.now()}`,
            title,
            dueDate: "",
            done: false,
            completedAt: 0,
            createdAt: Date.now(),
            createdAtText: new Date().toISOString(),
            creatorName: state.selectedPic,
            steps: [],
            reminder: "",
            assignees: [],
            repeatRule: "none",
            note: "",
            pendingSync: true
          };
          state.myWork.unshift(task);
          state.selectedMyWorkId = task.id;
          state.newMyWorkTaskId = task.id;
          commitUi("push");
          saveMyWorkTaskToDatabase(task);
        }
      }
      if (event.key === "Enter" && event.target?.id === "my-work-step") {
        event.preventDefault();
        const task = state.myWork.find((item) => item.id === state.selectedMyWorkId);
        const title = event.target.value.trim();
        if (task && title) {
          task.steps.push({ title, done: false });
          state.addingMyWorkStepId = "";
          commitUi("replace");
          saveMyWorkTaskToDatabase(task);
        }
      }
      if (event.key === "Enter" && event.target?.id === "my-work-assignee") {
        event.preventDefault();
        event.target.blur();
      }
      if (event.key === "Escape" && state.notesPopupTarget) {
        state.notesPopupTarget = "";
        commitUi("replace");
      }
      if (event.key === "Escape" && state.annualActionPopup) {
        closeAnnualActionPopup();
      }
    });

    async function refreshDatabaseStatus(background = false) {
      const chip = document.getElementById("database-status-chip");
      if (!chip) return;
      const controller = new AbortController();
      const timeout = window.setTimeout(() => controller.abort(), 8000);
      try {
        const response = await appFetch("/api/health/database", { cache: "no-store", signal: controller.signal, headers: { Accept: "application/json" } }, background ? "" : "Checking database connection...");
        const result = await response.json();
        if (result.connected) {
          databaseHealthStatus = { text: "Database: connected", className: "database-status-chip is-connected", title: "Core operational tables are reachable in Supabase." };
        } else if (result.configured) {
          databaseHealthStatus = { text: "Database: migration needed", className: "database-status-chip is-warning", title: result.message || "Supabase is configured but the schema is not ready." };
        } else {
          databaseHealthStatus = { text: "Database: demo mode", className: "database-status-chip is-demo", title: "Local demo data is active. Configure Supabase to persist records." };
        }
        renderDatabaseSyncStatus();
      } catch (error) {
        console.warn("[database health] request failed", error);
        databaseHealthStatus = { text: "Database: demo mode", className: "database-status-chip is-demo", title: "The demo is running without a reachable backend." };
        renderDatabaseSyncStatus();
      } finally {
        window.clearTimeout(timeout);
      }
    }

    rerender();
    persistDemoState();
    // Initial UI uses the local workspace immediately. Supabase refreshes
    // silently afterwards so slow connections never block navigation.
    loadCurrentProfile(true);
    loadSharedClients(true);
    const scheduleBackgroundLoad = window.requestIdleCallback || ((callback) => window.setTimeout(callback, 750));
    scheduleBackgroundLoad(() => {
      loadSharedCases(true);
      loadSharedOperationalWorkspaces(true);
      loadSharedMyWork(true);
      loadSharedAnnouncements(true);
      refreshDatabaseStatus(true);
    });
    window.setInterval(() => {
      if (document.visibilityState !== "visible") return;
      loadSharedAnnouncements(true);
    }, 120000);
    window.setInterval(() => {
      if (document.visibilityState !== "visible") return;
      refreshDatabaseStatus(true);
    }, 300000);
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState !== "visible") return;
      loadSharedClients(true);
      loadSharedCases(true);
      loadSharedMyWork(true);
      loadSharedAnnouncements(true);
    });
    window.setTimeout(() => {
      queueLatestFameAnnouncement();
    }, 280);
    syncBrowserHistory("replace");
  </script>
</body>
</html>
